app-id: uk.co.parallelrealities.games.edgar
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: edgar
rename-icon: edgar
rename-desktop-file: edgar.desktop
rename-appdata-file: edgar.appdata.xml
finish-args:
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json

  - name: edgar
    buildsystem: autotools
    no-autogen: true
    sources:
      - type: git
        url: https://github.com/riksweeney/edgar
        tag: '1.38'
        commit: 8faa8251c27e3fb463c515db151b1551dd82339f
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
      - type: patch
        path: fix-appdata.patch
      - type: shell
        commands:
          - sed -i -e 's|/usr|${FLATPAK_DEST}|' makefile
          - sed -i -e 's|$(PREFIX)/games/|$(PREFIX)/bin/|' makefile
